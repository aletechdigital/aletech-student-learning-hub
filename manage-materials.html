
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Learning Materials - ALETECH</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263445;
        }

        header {
            background: #15345b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background: #102947;
            padding: 15px;
            text-align: right;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            padding: 30px 7%;
        }

        h2 {
            color: #15345b;
            margin-bottom: 12px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        select {
            padding: 10px;
            width: 100%;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .material-card {
            background: white;
            padding: 22px;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .material-card p {
            margin: 10px 0;
            line-height: 1.5;
        }

        .status {
            font-weight: bold;
            text-transform: capitalize;
        }

        button {
            padding: 11px 17px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin: 8px 8px 0 0;
        }

        .view-btn {
            background: #15345b;
        }

        .approve-btn {
            background: #16803c;
        }

        .reject-btn {
            background: #c62828;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        footer {
            background: #15345b;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media(max-width: 600px) {
            .container {
                padding: 25px 5%;
            }

            nav {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ALETECH STUDENT LEARNING HUB</h1>
    <p>Administrator - Learning Materials Approval</p>
</header>

<nav>
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="index.html">Home</a>
</nav>

<div class="container">

    <h2>Manage Learning Materials</h2>

    <p>Review learning materials uploaded by teachers and approve or reject them.</p>

    <div class="filters">
        <label for="statusFilter"><strong>Filter by Approval Status</strong></label>

        <select id="statusFilter">
            <option value="all">All Materials</option>
            <option value="pending">Awaiting Approval</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
        </select>
    </div>

    <p id="message">Loading learning materials...</p>

    <div id="materialsList"></div>

</div>

<footer>
    <p>&copy; 2026 ALETECH STUDENT LEARNING HUB</p>
    <p>Learn • Connect • Excel</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://pshincksginxlcgyqhrg.supabase.co";

const SUPABASE_KEY = "sb_publishable_ya_77Xgh4bIkH7poWYBwKw_RXe9JVcm";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const materialsList = document.getElementById("materialsList");
const message = document.getElementById("message");
const statusFilter = document.getElementById("statusFilter");

let allMaterials = [];

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(character) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[character];
    });
}

async function checkAdminAccess() {

    const { data: { user }, error: userError } =
        await client.auth.getUser();

    if (userError || !user) {
        window.location.href = "login.html";
        return false;
    }

    const { data: profile, error: profileError } = await client
        .from("profiles")
        .select("role")
        .eq("user_id", user.id)
        .single();

    if (profileError || !profile || profile.role !== "administrator") {
        window.location.href = "login.html";
        return false;
    }

    return true;
}

async function loadMaterials() {

    message.textContent = "Loading learning materials...";
    materialsList.innerHTML = "";

    const { data, error } = await client
        .from("learning_materials")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        message.textContent = "Unable to load materials: " + error.message;
        return;
    }

    allMaterials = data || [];

    displayMaterials();
}

function displayMaterials() {

    materialsList.innerHTML = "";

    const selectedStatus = statusFilter.value;

    const filteredMaterials = allMaterials.filter(material => {
        return selectedStatus === "all" ||
               material.status === selectedStatus;
    });

    if (filteredMaterials.length === 0) {
        message.textContent = "No learning materials found for this status.";
        return;
    }

    message.textContent = "Learning materials found: " + filteredMaterials.length;

    filteredMaterials.forEach(material => {

        const card = document.createElement("div");
        card.className = "material-card";

        card.innerHTML = `
            <h3>${escapeHTML(material.material_title)}</h3>

            <p><strong>Subject:</strong> ${escapeHTML(material.subject_name)}</p>

            <p><strong>Curriculum:</strong> ${escapeHTML(material.curriculum)}</p>

            <p><strong>Class / Grade:</strong> ${escapeHTML(material.grade_or_form)}</p>

            <p><strong>Description:</strong> ${escapeHTML(material.description || "No description provided")}</p>

            <p><strong>Date Uploaded:</strong>
                ${material.created_at ? escapeHTML(new Date(material.created_at).toLocaleString()) : "Not available"}
            </p>

            <p><strong>Status:</strong>
                <span class="status">${escapeHTML(material.status)}</span>
            </p>

            <button class="view-btn">Open Notes</button>

            ${material.status === "pending" ? `
                <button class="approve-btn">Approve</button>
                <button class="reject-btn">Reject</button>
            ` : ""}
        `;

        const viewButton = card.querySelector(".view-btn");

        viewButton.addEventListener("click", () => {
            openMaterial(material);
        });

        const approveButton = card.querySelector(".approve-btn");

        if (approveButton) {
            approveButton.addEventListener("click", () => {
                updateMaterialStatus(material.id, "approved");
            });
        }

        const rejectButton = card.querySelector(".reject-btn");

        if (rejectButton) {
            rejectButton.addEventListener("click", () => {
                updateMaterialStatus(material.id, "rejected");
            });
        }

        materialsList.appendChild(card);
    });
}

async function openMaterial(material) {

    if (!material.file_url) {
        alert("No file is attached to this material.");
        return;
    }

    message.textContent = "Preparing your notes...";

    const { data, error } = await client.storage
        .from("learning-notes")
        .createSignedUrl(material.file_url, 300);

    if (error) {
        message.textContent = "Unable to open notes: " + error.message;
        return;
    }

    message.textContent = "Opening notes...";

    window.location.href = data.signedUrl;
}

async function updateMaterialStatus(id, newStatus) {

    const confirmation = confirm(
        "Are you sure you want to " + newStatus + " this material?"
    );

    if (!confirmation) return;

    message.textContent = "Updating material status...";

    const { error } = await client
        .from("learning_materials")
        .update({ status: newStatus })
        .eq("id", id);

    if (error) {
        message.textContent = "Update failed: " + error.message;
        return;
    }

    alert("Material " + newStatus + " successfully!");

    await loadMaterials();
}

statusFilter.addEventListener("change", displayMaterials);

async function startPage() {

    const allowed = await checkAdminAccess();

    if (!allowed) return;

    await loadMaterials();
}

startPage();
</script>

</body>
</html>
