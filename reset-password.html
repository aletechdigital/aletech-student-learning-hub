
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ALETECH</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .reset-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 {
            color: #102a43;
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
        }

        button {
            background: #102a43;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="reset-box">
    <h2>Reset Your Password</h2>
    <p>Enter your registered email address.</p>

    <form id="resetForm">
        <input type="email" id="email"
        placeholder="Enter your email address" required>

        <button type="submit">Send Reset Link</button>
    </form>

    <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://pshincksginxlcgyqhrg.supabase.co";
const SUPABASE_KEY = "sb_publishable_ya_77Xgh4bIkH7poWYBwKw_RXe9JVcm";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            flowType: "implicit",
            detectSessionInUrl: true,
            persistSession: true
        }
    }
);
supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
        document.getElementById("message").textContent =
            "Password reset verified. You can now enter your new password.";
    }
});
document.getElementById("resetForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message");

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: "http://127.0.0.1:5500/update-password.html"
    });

    if (error) {
        message.textContent = error.message;
    } else {
        message.textContent = "If the account exists, a password reset link will be sent to your email.";
    }
});
</script>

</body>
</html>
