
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose New Password - ALETECH</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .password-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 {
            color: #102a43;
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
        }

        button {
            background: #102a43;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="password-box">
    <h2>Create New Password</h2>

    <form id="passwordForm">
        <input type="password" id="newPassword"
        placeholder="Enter new password" minlength="8" required>

        <input type="password" id="confirmPassword"
        placeholder="Confirm new password" minlength="8" required>

        <button type="submit">Update Password</button>
    </form>

    <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://pshincksginxlcgyqhrg.supabase.co";
const SUPABASE_KEY = "sb_publishable_ya_77Xgh4bIkH7poWYBwKw_RXe9JVcm";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

document.getElementById("passwordForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    if (newPassword !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    const { error } = await supabaseClient.auth.updateUser({
        password: newPassword
    });

    if (error) {
        message.textContent = error.message;
    } else {
        message.textContent = "Password updated successfully! You can now log in.";
        document.getElementById("passwordForm").reset();
    }
});
</script>

</body>
</html>
