
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - ALETECH</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #15345b;
            text-align: center;
        }

        p {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #15345b;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2874a6;
        }

        a {
            color: #15345b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ALETECH</h1>
    <p>STUDENT LEARNING HUB</p>

    <h2>Student Registration</h2>
    <p>Create your student account.</p>

    
<form id="registrationForm">

    <label>Full Name</label>
    <input type="text" id="full_name" required
    placeholder="Enter your full name">

    <label>Email Address</label>
    <input type="email" id="email" required
    placeholder="Enter your email">

    <label>Phone Number</label>
    <input type="tel" id="phone" required
    placeholder="Enter your phone number">

    <label>Curriculum</label>
    <select id="curriculum" required>
        <option value="">Select curriculum</option>
        <option value="CBC">CBC Senior School</option>
        <option value="844">8-4-4 System</option>
    </select>

    <label>Grade / Form</label>
    <select id="grade_or_form" required>
        <option value="">Select grade or form</option>
        <option>Grade 10</option>
        <option>Grade 11</option>
        <option>Grade 12</option>
        <option>Form 1</option>
        <option>Form 2</option>
        <option>Form 3</option>
        <option>Form 4</option>
    </select>

    <label>Create Password</label>
    <input type="password" id="password" required
    minlength="8" placeholder="Create a password">

    <button type="submit">Register</button>

</form>


    <p>Already registered? <a href="login.html">Login here</a></p>

    <p><a href="index.html">Back to Homepage</a></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://pshincksginxlcgyqhrg.supabase.co";
const SUPABASE_KEY = "sb_publishable_ya_77Xgh4bIkH7poWYBwKw_RXe9JVcm";

window.supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
console.log("SUPABASE CLIENT CREATED");
document.getElementById("registrationForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const fullName = document.getElementById("full_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const curriculum = document.getElementById("curriculum").value;
    const gradeOrForm = document.getElementById("grade_or_form").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
    emailRedirectTo: "https://aletechdigital.github.io/aletech-student-learning-hub/",
    data: {
                full_name: fullName,
                phone: phone,
                curriculum: curriculum,
                grade_or_form: gradeOrForm
            }
        }
    });

    if (error) {
        alert(error.message);
        return;
    }

    alert("Registration submitted! Please check your email to confirm your account.");
    document.getElementById("registrationForm").reset();
});
</script>

</body>
</html>
